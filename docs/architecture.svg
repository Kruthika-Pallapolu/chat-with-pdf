  </g>

  <path d="M500 475 V525" class="arrow"/>

  <rect x="275" y="532" width="450" height="65" rx="10" fill="#172B3D" stroke="#0EA5A4" stroke-width="1.6"/>
  <text x="500" y="559" text-anchor="middle" class="node-title">Document Vector Index</text>
